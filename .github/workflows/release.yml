name: Release

on:
  push:
    tags: ['[0-9]+.[0-9]+.[0-9]+']

permissions:
  contents: read

jobs:
  release:
    runs-on: ubuntu-latest
    environment: release
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          cache: maven
          server-id: central
          server-username: CENTRAL_TOKEN_USERNAME
          server-password: CENTRAL_TOKEN_PASSWORD
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Set the version from the tag
        run: mvn -B versions:set -DnewVersion="${GITHUB_REF_NAME}" -DgenerateBackupPoms=false
      # a release cannot be undone: tests and the conformance suite run before anything is uploaded
      - name: Verify (tests and conformance)
        run: mvn -B verify -Dmcp.conformance=true
      - name: Sign and deploy to Maven Central
        run: mvn -B -Prelease deploy -DskipTests
        env:
          CENTRAL_TOKEN_USERNAME: ${{ secrets.CENTRAL_TOKEN_USERNAME }}
          CENTRAL_TOKEN_PASSWORD: ${{ secrets.CENTRAL_TOKEN_PASSWORD }}
          MAVEN_GPG_KEY: ${{ secrets.GPG_PRIVATE_KEY }}
          MAVEN_GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}
